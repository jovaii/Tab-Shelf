<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#e8ece9">
    <title>Tab Shelf</title>
    <link rel="stylesheet" href="shared/tokens.css">
    <link rel="stylesheet" href="shelf.css">
  </head>
  <body>
    <a class="skip-link" href="#inventory-title">Skip to open tabs</a>
    <div class="background-image" aria-hidden="true"></div>
    <main class="shelf-app" aria-labelledby="greeting">
      <header class="shelf-header">
        <div class="shelf-header__copy">
          <p class="product-kicker">Your browsing desk</p>
          <h1 id="greeting">Good morning</h1>
          <p id="current-date" class="current-date">Monday, August 24, 2026</p>
        </div>
        <button id="settings-button" class="settings-button" type="button">
          <span class="settings-button__glyph" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="visually-hidden">Open theme settings</span>
        </button>
      </header>

      <div class="shelf-rule" aria-hidden="true"><span></span></div>

      <section class="inventory" aria-labelledby="inventory-title">
        <div class="inventory-bar">
          <div class="inventory-bar__title">
            <h2 id="inventory-title">Open tabs</h2>
            <span class="inventory-bar__rail" aria-hidden="true"></span>
          </div>
          <div class="inventory-bar__actions">
            <button id="new-category" class="secondary-action" type="button">
              New category
            </button>
            <span id="domain-count" class="inventory-stat">0 domains</span>
            <span class="inventory-stat__separator" aria-hidden="true"></span>
            <span id="duplicate-count" class="inventory-stat">No duplicates</span>
            <button id="close-extra-shelves" class="primary-action" type="button" hidden>
              Close extra shelves
            </button>
          </div>
        </div>

        <p id="status" role="status" aria-live="polite" class="status-message"></p>
        <div id="workspace-root" class="workspace-root"></div>
      </section>

      <footer class="shelf-footer">
        <div class="open-total">
          <strong id="open-count">0</strong>
          <span>Open tabs</span>
        </div>
        <p class="product-credit">Tab Shelf by James Li</p>
      </footer>
    </main>

    <dialog id="category-dialog" class="category-dialog" aria-labelledby="category-dialog-title">
      <form method="dialog" id="category-form" class="category-dialog__form">
        <p class="category-dialog__eyebrow">Workspace</p>
        <h2 id="category-dialog-title">New category</h2>
        <label class="category-dialog__field" for="category-name">
          <span>Category name</span>
          <input id="category-name" name="category-name" autocomplete="off" maxlength="40" required>
        </label>
        <p id="category-error" class="category-dialog__error" role="alert"></p>
        <div class="category-dialog__actions">
          <button id="category-cancel" class="secondary-action" type="button">Cancel</button>
          <button id="category-submit" class="primary-action" type="submit">Create category</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="shelf.mjs"></script>
  </body>
</html>
